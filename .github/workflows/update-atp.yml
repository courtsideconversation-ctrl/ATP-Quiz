name: Update ATP Top 100

on:
  schedule:
    # Every Monday at 8am UTC (ATP rankings publish Monday mornings)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-players:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Fetch ATP top 100 and download photos
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/fetch_atp.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game/data/players.json game/images/
          git diff --cached --quiet || git commit -m "chore: update ATP top 100 [$(date +%Y-%m-%d)]"
          git push
